name: VELION Repaired Draft Independent Sandbox QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-real-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SANDBOX_IMAGE: node@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - name: Checkout exact source without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare and verify the assistant-revised draft
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/velion-draft/test"
          cp evidence/structured-repaired-20261111/repaired-app.mjs.txt "$RUNNER_TEMP/velion-draft/app.mjs"
          cp evidence/structured-repaired-20261111/repaired-test.mjs.txt "$RUNNER_TEMP/velion-draft/test/app.test.mjs"
          printf '%s  %s\n' '022f8954aa80572201cd39941636d084e756a57bf8c2bcfbeccbe325afd98305' "$RUNNER_TEMP/velion-draft/app.mjs" | sha256sum --check
          printf '%s  %s\n' '8a8859e9c942beb81ce8a2083cfedc13ed8d9f500d476655ac1195612626187c' "$RUNNER_TEMP/velion-draft/test/app.test.mjs" | sha256sum --check
      - name: Pull pinned sandbox image
        id: image
        run: docker pull "$SANDBOX_IMAGE"
      - name: Run assistant-revised tests in an isolated container
        if: always() && steps.prepare.outcome == 'success' && steps.image.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 60s docker run --rm --pull=never --network=none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=33554432 \
            --mount "type=bind,src=$RUNNER_TEMP/velion-draft,dst=/work,readonly" \
            "$SANDBOX_IMAGE" node --test /work/test/app.test.mjs
      - name: Run independently authored tests in an isolated container
        if: always() && steps.prepare.outcome == 'success' && steps.image.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 60s docker run --rm --pull=never --network=none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=33554432 \
            --mount "type=bind,src=$RUNNER_TEMP/velion-draft,dst=/work,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/qa,dst=/qa,readonly" \
            "$SANDBOX_IMAGE" node --test /qa/independent-task-suite.mjs
