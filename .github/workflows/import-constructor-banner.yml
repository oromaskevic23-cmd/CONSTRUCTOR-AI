name: Import owner-provided CONSTRUCTOR AI banner (one-shot)

on:
  push:
    branches:
      - branding/constructor-ai-enterprise-banner-20261031
    paths:
      - '.github/workflows/import-constructor-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original-banner:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout authorized branding branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download exact uploaded image and verify original SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 --max-time 120             'https://4ae07041-5100-41a2-bc57-2d6b37720789.sandbox.floot.app/_cdn/static/2caeab05-3123-4136-bc24-0eb8aff680ef-constructor-ai-enterprise-banner.jpg'             --output assets/constructor-ai-enterprise-banner.jpg
          echo "3d22f9dfd8eff4cf17a886eee41bba3f454dc12941e6b1d6ca18de478dbc3749  assets/constructor-ai-enterprise-banner.jpg" | sha256sum --check
          test "$(stat -c%s assets/constructor-ai-enterprise-banner.jpg)" -eq 505486
          file assets/constructor-ai-enterprise-banner.jpg
      - name: Commit verified original banner to this branding branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/constructor-ai-enterprise-banner.jpg
          git commit -m 'assets(constructor): install original 1536x864 enterprise banner'
          git push origin HEAD:refs/heads/branding/constructor-ai-enterprise-banner-20261031
