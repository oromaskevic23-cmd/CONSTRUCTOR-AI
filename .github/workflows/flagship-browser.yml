name: CONSTRUCTOR AI — Real Chromium Flagship Acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: constructor-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned ephemeral browser driver (do not change lockfile)
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Install real Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify reviewed application
        run: npm run verify
      - name: Run real Studio UI and exported-app browser acceptance
        run: node e2e/browser-acceptance.mjs
