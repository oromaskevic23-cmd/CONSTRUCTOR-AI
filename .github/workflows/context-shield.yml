name: CONSTRUCTOR AI verified local Context Shield

on:
  pull_request:
    paths:
      - 'engineering/context-shield.mjs'
      - 'test/context-shield.test.mjs'
      - 'docs/CONTEXT_SHIELD_SPRINT_20261031.md'
      - '.github/workflows/context-shield.yml'
  push:
    branches: [main]
    paths:
      - 'engineering/context-shield.mjs'
      - 'test/context-shield.test.mjs'
      - 'docs/CONTEXT_SHIELD_SPRINT_20261031.md'
      - '.github/workflows/context-shield.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-shield:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout no persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check engineering/context-shield.mjs && node --check test/context-shield.test.mjs
      - name: Run 14 real no-network filesystem tests
        run: node --test test/context-shield.test.mjs
