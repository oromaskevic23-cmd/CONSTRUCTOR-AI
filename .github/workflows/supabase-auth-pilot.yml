name: Supabase Auth Pilot
on:
  push:
    branches: [engineering/supabase-node-auth-pilot-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated auth dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check engineering/supabase-auth-client.mjs
      - name: Run auth pilot tests
        run: node --test tests/supabase-auth-client.test.mjs
