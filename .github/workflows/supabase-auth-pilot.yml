name: Supabase Auth Pilot
on:
  push:
    branches: [engineering/supabase-node-auth-pilot-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated auth dependency
        run: npm install --no-save --package-lock=false @supabase/supabase-js
      - name: Syntax check
        run: node --check engineering/supabase-auth-client.mjs
      - name: Run auth pilot tests
        run: node --test tests/supabase-auth-client.test.mjs
