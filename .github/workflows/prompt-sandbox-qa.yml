# Project author and founding architect: Alexander Nikolaevich Romaskevich (RomaskevicH).
name: CONSTRUCTOR AI — Prompt Code Sandbox and Independent QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: constructor-prompt-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NODE_SANDBOX: node@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22 for trusted control plane
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run contract and approval negative tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Pull pinned Node sandbox image, before network is disabled
        run: docker pull "$NODE_SANDBOX"
      - name: Generate synthetic untrusted app via identical model contract
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-quarantine"
          node tools/prepare-synthetic-task-build.mjs "$RUNNER_TEMP/model-quarantine" > "$RUNNER_TEMP/fixture-result.json"
          STAGE="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).stage' "$RUNNER_TEMP/fixture-result.json")"
          test -d "$STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
      - name: Execute canonical no-network Docker checks and independent QA
        shell: bash
        run: |
          set -euo pipefail
          bash tools/run-isolated-task-qa.sh "${{ steps.stage.outputs.stage }}" "$RUNNER_TEMP"
          node -e 'let q=require(process.argv[1]);if(q.release!=="DENIED"||q.approval!=="NOT_GRANTED"||q.status!=="UNATTESTED_QA_LOG_SHAPE_ONLY"||q.execution!=="NOT_ATTESTED_BY_COLLECTOR")process.exit(1)' "$RUNNER_TEMP/task-qa-observation.json"
      - name: Preserve test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-task-build-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/task-qa-observation.json
            ${{ runner.temp }}/independent-qa.log
            ${{ steps.stage.outputs.stage }}/stage-manifest.json
          retention-days: 30
          if-no-files-found: error
