name: CONSTRUCTOR AI real local LLM to isolated QA proof

on:
  pull_request:
    paths:
      - 'live_factory/**'
      - 'live_qa/**'
      - 'live_tests/**'
      - '.github/workflows/constructor-live-llm.yml'
      - 'docs/FIRST_REAL_LLM_BUILD.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constructor-live-model
  cancel-in-progress: false

jobs:
  bounded-real-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MODELS: '/tmp/constructor-private-ollama-models'
      CONSTRUCTOR_SYNTHETIC_LLM_CONSENT: 'EXPLICIT_ONE_TIME_CI_DEMO'
    steps:
      - name: Checkout exact PR without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python harness negative controls without inference
        run: |
          python3 -m compileall -q live_factory live_tests
          python3 -m unittest discover -s live_tests -p 'test_*.py' -v
      - name: Install checksum-verified Ollama on disposable free runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          curl --proto '=https' --tlsv1.2 -fL --retry 2 --connect-timeout 15 --max-time 480 \
            'https://github.com/ollama/ollama/releases/download/v0.40.11/ollama-linux-amd64.tar.zst' \
            --output "$RUNNER_TEMP/ollama-v0.40.11.tar.zst"
          echo "7bedab90dd122661be78798e9f0edf37fccf0cccf2699d2c58ea1a3afdc04b6d  $RUNNER_TEMP/ollama-v0.40.11.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama-bin"
          tar --zstd -xf "$RUNNER_TEMP/ollama-v0.40.11.tar.zst" -C "$RUNNER_TEMP/ollama-bin"
          test -x "$RUNNER_TEMP/ollama-bin/bin/ollama"
      - name: Prepare pinned Node.js Docker image and verify isolation capabilities
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker pull node:22-alpine
          IMAGE="$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')"
          [[ "$IMAGE" =~ ^node@sha256:[a-f0-9]{64}$ ]]
          echo "CONSTRUCTOR_SANDBOX_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Docker image digest: $IMAGE"
      - name: Start loopback-only real model and fetch public Qwen coder weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          "$RUNNER_TEMP/ollama-bin/bin/ollama" serve > "$RUNNER_TEMP/constructor-ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --noproxy '*' -fsS 'http://127.0.0.1:11434/api/tags' >/dev/null; then break; fi
            sleep 1
          done
          curl --noproxy '*' -fsS 'http://127.0.0.1:11434/api/tags' >/dev/null
          timeout 480 "$RUNNER_TEMP/ollama-bin/bin/ollama" pull qwen2.5-coder:1.5b-instruct
          "$RUNNER_TEMP/ollama-bin/bin/ollama" list
      - name: Real LLM generation and no-network Docker execution plus independent QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m live_factory.first_real_llm_build
      - name: Upload model source and independent QA evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: constructor-first-real-model-proof
          path: |
            /tmp/constructor-llm-evidence/evidence.json
            /tmp/constructor-llm-evidence/winning-source.mjs
          if-no-files-found: warn
          retention-days: 14
