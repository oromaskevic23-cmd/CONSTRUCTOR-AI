name: constructor-ai-taskmanager-ci

on:
  push:
    branches: [main, feature/task-manager-poc]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image (multi-stage)
        run: docker build -t constructor-ai-task-manager .

      - name: Run Docker container
        run: |
          docker run -d -e DATABASE_PATH=/data/db.sqlite --name constructor-ai-task-manager -p 3000:3000 constructor-ai-task-manager
          sleep 3

      - name: Install jq (required for smoke test parsing)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Docker CRUD smoke tests
        run: |
          set -e
          BASE_URL=http://localhost:3000
          # CREATE
          CREATE_RESP=$(curl -s -X POST "$BASE_URL/tasks" -H "Content-Type: application/json" -d '{"title":"smoke","description":"smoke"}')
          echo "CREATE_RESP=$CREATE_RESP"
          ID=$(echo "$CREATE_RESP" | jq -r '.id')
          if [ "$ID" = "null" ] || [ -z "$ID" ]; then
            echo "Create failed"; exit 1
          fi
          # READ
          curl --fail "$BASE_URL/tasks/$ID"
          # UPDATE
          curl -s -X PUT "$BASE_URL/tasks/$ID" -H "Content-Type: application/json" -d '{"title":"smoke-updated"}'
          # COMPLETE
          curl --fail -X POST "$BASE_URL/tasks/$ID/complete"
          # DELETE
          curl --fail -X DELETE "$BASE_URL/tasks/$ID"

      - name: Stop Docker container
        run: docker stop constructor-ai-task-manager || true

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage
          if-no-files-found: warn
