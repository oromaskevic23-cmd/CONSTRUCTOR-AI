name: Verified Reference CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verified-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check syntax
        run: npm run check
      - name: Unit tests and HTTP smoke
        run: npm test
      - name: Build three portable flagship acceptance ZIPs
        run: node tools/build-acceptance.mjs acceptance-output
      - name: Validate ZIP hashes and run all three extracted applications
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-acceptance.mjs acceptance-output
          for kind in tasks crm dashboard; do
            dest="$RUNNER_TEMP/constructor-$kind"
            mkdir -p "$dest"
            unzip -q "acceptance-output/$kind-local-app.zip" -d "$dest"
            (cd "$dest" && npm run verify && npm test)
          done
      - name: Source integrity inventory
        run: node tools/verify.mjs > verification-inventory.json
      - name: Publish verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-reference-${{ github.sha }}
          path: |
            verification-inventory.json
            acceptance-output/
          retention-days: 30
